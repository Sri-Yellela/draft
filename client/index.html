<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draft</title>
    <!-- The /d mark — the extension's icon, like for like (09-30). There was no favicon at all. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Barlow Condensed (Lucy tin brand) + DM Sans (body) are SELF-HOSTED — imported in main.jsx,
         served from our own origin. The <link> and two preconnects to fonts.googleapis.com /
         fonts.gstatic.com that used to sit here handed Google every visitor's IP and user-agent on
         every page load, undisclosed. Do not re-add them; test/selfHostedFonts.test.js fails. -->

    <!-- D91 · NO FLASH: the theme's ground, scheme and attributes, set before first paint. vite.config.js
         replaces the marker below with themes/index.js prePaintScript() — generated from the theme
         registry, so it holds no colour and cannot drift. (It replaced a script that set a data-bg
         attribute nothing read.) -->
    <!--d91-pre-paint-->

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; }
      @keyframes spin        { to { transform: rotate(360deg); } }
      @keyframes shimmer     { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
      @keyframes fadeSlideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
      @keyframes scrollUp    { 0%{transform:translateY(0)} 100%{transform:translateY(-50%)} }
      @keyframes pulseGlow   { 0%,100%{opacity:1} 50%{opacity:0.6} }
      @keyframes zoomIn      { from{opacity:0;transform:scale(0.97)} to{opacity:1;transform:scale(1)} }

      /* Lucy brand: Barlow Condensed ExtraBold site title */
      .site-title {
        font-family: 'Barlow Condensed', 'DM Sans', system-ui, sans-serif;
        font-weight: 800;
        font-size: 28px;
        color: #0f0f0f;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

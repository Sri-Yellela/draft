<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 260px; padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F7F6F2; color: #28251D;
    }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .header-title { font-size: 15px; font-weight: 600; color: #28251D; }
    .btn {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 9px 14px; margin-bottom: 8px;
      border-radius: 10px; border: none; font-size: 13px;
      font-weight: 500; cursor: pointer;
      transition: background 0.15s ease;
      font-family: inherit; text-align: left;
    }
    .btn-primary { background: #01696F; color: #fff; }
    .btn-primary:hover { background: #0C4E54; }
    .btn-primary:disabled { background: #6aacaf; cursor: default; }
    .btn-secondary { background: #F3F0EC; color: #28251D; border: 1px solid #D4D1CA; }
    .btn-secondary:hover { background: #E6E4DF; }
    .btn-secondary:disabled { color: #A9A7A1; cursor: default; }
    .status { font-size: 11px; color: #7A7974; margin-top: 6px; text-align: center; min-height: 14px; }
    .divider { border: none; border-top: 1px solid #DCD9D5; margin: 10px 0; }
    .progress-bar {
      width: 100%; height: 6px;
      background: #DCD9D5; border-radius: 9999px;
      margin: 8px 0 4px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: #01696F;
      border-radius: 9999px;
      transition: width 300ms ease;
    }
    .progress-text {
      font-size: 11px; color: #7A7974;
      text-align: center; margin: 0;
    }
    .result-text {
      font-size: 11px; text-align: center; margin: 4px 0 0;
    }
    .result-text.success { color: #437A22; }
    .result-text.error   { color: #a12c2c; }
    #job-preview {
      display: none;
      background: #fff; border: 1px solid #DCD9D5; border-radius: 8px;
      padding: 10px 12px; margin-bottom: 8px; font-size: 12px;
    }
    #job-preview .job-title { font-weight: 600; color: #28251D; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #job-preview .job-company { color: #7A7974; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* WHO THE EXTENSION IS ACTING AS. Always rendered, never hidden behind a hover or a menu —
       an identity a user has to go looking for is not a visible one. */
    #identity {
      display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
      font-size: 11px; color: #7A7974; margin: 0 0 8px; min-height: 14px;
    }
    #identity .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #identity .who strong { color: #28251D; font-weight: 600; }
    #identity .not-admin { color: #7A7974; }
    /* D13, the companion: what this page is, and the one or two actions it calls for. */
    #companion { display: none; margin-bottom: 8px; }
    #companion .ctx-line { font-size: 11px; color: #7A7974; margin: 4px 0 8px; }
    #companion .ctx-line.saved { color: #437A22; }
    #companion .questions { font-size: 11px; color: #28251D; background: #FFF4E5; border: 1px solid #F2D7B0;
      border-radius: 8px; padding: 6px 8px; margin: 0 0 8px; }
    #recent { display: none; margin-bottom: 8px; }
    #recent .recent-head { font-size: 11px; font-weight: 600; color: #7A7974; margin-bottom: 4px; }
    #recent ul { list-style: none; }
    #recent li { font-size: 12px; padding: 4px 0; border-bottom: 1px solid #ECEAE5;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #recent li span { color: #7A7974; }
    .all-head { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
      color: #7A7974; margin: 0 0 6px; }
    .btn-row { display: flex; gap: 6px; }
    .btn-row .btn { justify-content: center; }
    #btn-disconnect {
      background: none; border: none; padding: 0; cursor: pointer;
      color: #01696F; font-size: 11px; text-decoration: underline; flex: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="4" y="2" width="16" height="20" rx="2" stroke="#01696F" stroke-width="1.5"/>
      <path d="M8 7h8M8 11h8M8 15h5" stroke="#01696F" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <span class="header-title">draft</span>
  </div>

  <div id="identity">
    <span class="who" id="identity-who"></span>
    <button id="btn-disconnect" style="display:none">Disconnect</button>
  </div>

  <div id="job-preview">
    <div class="job-title" id="preview-title"></div>
    <div class="job-company" id="preview-company"></div>
  </div>

  <button class="btn btn-primary" id="btn-sign-in" style="display:none">Sign in to Draft</button>

  <!-- D13, THE COMPANION. companion.js decides which of the four actions this page calls for; the
       full set stays below ("Everything"), because a wrong guess must never hide an action. -->
  <div id="companion">
    <p class="ctx-line" id="ctx-line"></p>
    <p class="questions" id="ctx-questions" style="display:none"></p>
    <button class="btn btn-primary" id="btn-fill-primary" style="display:none">Fill it</button>
    <div class="btn-row" id="posting-actions" style="display:none">
      <button class="btn btn-primary" id="btn-capture-primary">Capture it</button>
      <button class="btn btn-secondary" id="btn-score-primary">Score it</button>
    </div>
  </div>
  <div id="recent">
    <div class="recent-head">Your recent captures</div>
    <ul id="recent-list"></ul>
  </div>

  <hr class="divider">
  <p class="all-head">Everything</p>
  <button class="btn btn-secondary" id="btn-capture-job" style="display:none">Capture job</button>
  <button class="btn btn-secondary" id="btn-fill">Fill application</button>
  <button class="btn btn-secondary" id="btn-ats">ATS Score Tool</button>
  <button class="btn btn-secondary" id="btn-resume">Open Resume Builder</button>
  <button class="btn btn-secondary" id="btn-linkedin">Sign in with LinkedIn</button>
  <button class="btn btn-secondary" id="btn-settings">Keyboard Shortcuts</button>

  <p class="result-text" id="last-capture" style="display:none"></p>
  <p class="status" id="status"></p>

  <script src="config.js"></script>
  <script src="companion.js"></script>
  <script src="popup.js"></script>
</body>
</html>

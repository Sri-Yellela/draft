<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- D23: the site's tokens (generated from client/src/styles/colorTokens.js, with the self-hosted
       faces) and the site's controls. ⛔ No colour literal here — test/colorLiteralGuard.test.js. -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 284px; padding: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .status { font-size: 11px; color: var(--c-ink-faint); margin-top: 8px; text-align: center; min-height: 14px; }
    .result-text { font-size: 11px; text-align: center; margin: 6px 0 0; }
    .result-text.success { color: var(--c-success); }
    .result-text.error   { color: var(--c-danger); }
    .result-text.warn    { color: var(--c-warning); }
    hr.divider { border: 0; border-top: 1px solid var(--c-border); margin: 12px 0; }

    /* WHO THE EXTENSION IS ACTING AS. Always rendered, never hidden behind a hover or a menu —
       an identity a user has to go looking for is not a visible one. */
    #identity {
      display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
      font-size: 11px; color: var(--c-ink-muted); margin: 0 0 12px; min-height: 14px;
    }
    #identity .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #identity .who strong { color: var(--c-ink); font-weight: 700; }
    #identity .not-admin { color: var(--c-ink-faint); }

    /* D23, THE MANUAL CONTEXT TRIGGER. Nothing about the page is read until this is pressed. */
    #btn-read-page { justify-content: space-between; }
    #btn-read-page .lbl { display: inline-flex; align-items: center; gap: 8px; }
    .read-hint { font-size: 11px; color: var(--c-ink-faint); margin: -2px 0 12px; }

    #job-preview {
      display: none; background: var(--c-surface-solid); border-radius: 12px; box-shadow: var(--c-depth-rest);
      padding: 10px 12px; margin-bottom: 10px; font-size: 12px;
    }
    #job-preview .job-company { font-size: 15px; color: var(--c-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #job-preview .job-title { color: var(--c-ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* D13, the companion: what this page is, and the one or two actions it calls for. */
    #companion { display: none; margin-bottom: 4px; }
    #companion .ctx-line { font-size: 11px; color: var(--c-ink-muted); margin: 0 0 8px; }
    #companion .ctx-line.saved { color: var(--c-success); }
    #companion .questions { font-size: 11px; color: var(--c-ink); background: var(--c-accent-quiet);
      border-radius: 12px; padding: 7px 9px; margin: 0 0 10px; }
    .btn-row { display: flex; gap: 8px; }
    .btn-row .btn { flex: 1 1 0; }
    #recent { display: none; margin-bottom: 4px; }
    #recent ul { list-style: none; }
    #recent li { font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--c-border);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--c-ink-muted); }
    #recent li .co { color: var(--c-ink); font-size: 13px; }
    .all-head { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
      color: var(--c-ink-faint); margin: 0 0 8px; }
    .squares { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .links { display: flex; justify-content: space-between; gap: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <span class="mark" role="img" aria-label="draft"><span class="mark-slash"></span><span class="mark-word"></span></span>
  </div>

  <div id="identity">
    <span class="who" id="identity-who"></span>
    <button class="link" id="btn-disconnect" style="display:none">Disconnect</button>
  </div>

  <button class="btn btn-primary" id="btn-sign-in" style="display:none">Sign in to Draft</button>

  <!-- D23, THE MANUAL CONTEXT TRIGGER (owner, 10-04). Context detection is never automatic on popup
       open: until this is pressed, the popup shows the four actions below and nothing else, reads
       nothing from the page and asks the server nothing about it. -->
  <button class="btn" id="btn-read-page" style="display:none" aria-keyshortcuts="R"
          aria-describedby="read-hint">
    <span class="lbl">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      Read this page
    </span>
    <kbd>R</kbd>
  </button>
  <p class="read-hint" id="read-hint" style="display:none">Nothing on this page is read until you press it.</p>

  <div id="job-preview">
    <div class="job-company logo-face" id="preview-company"></div>
    <div class="job-title" id="preview-title"></div>
  </div>

  <!-- D13, THE COMPANION. companion.js decides which of the four actions this page calls for — after
       the press above, never before. The four stay below ("Everything"): a wrong guess must never
       hide an action. -->
  <div id="companion">
    <p class="ctx-line" id="ctx-line"></p>
    <p class="questions" id="ctx-questions" style="display:none"></p>
    <button class="btn btn-primary" id="btn-fill-primary" style="display:none">Fill it</button>
    <div class="btn-row" id="posting-actions" style="display:none">
      <button class="btn btn-primary" id="btn-capture-primary">Capture it</button>
      <button class="btn" id="btn-score-primary">Score it</button>
    </div>
  </div>
  <div id="recent">
    <p class="all-head">Your recent captures</p>
    <ul id="recent-list"></ul>
  </div>

  <hr class="divider" id="all-divider" style="display:none">
  <p class="all-head" id="all-head" style="display:none">Everything</p>
  <div class="squares">
    <button class="sq" id="btn-capture-job" aria-label="Capture job" title="Capture job (Ctrl+Shift+K)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h10a1 1 0 0 1 1 1V21l-6-4-6 4V4.5a1 1 0 0 1 1-1z"/></svg>
      <span class="sq-cap" aria-hidden="true">capture</span>
    </button>
    <button class="sq" id="btn-fill" aria-label="Fill application" title="Fill application (Ctrl+Shift+Y)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h9l5 5v11H5z"/><path d="M14 4v5h5M8.5 13h7M8.5 16.5h4.5"/></svg>
      <span class="sq-cap" aria-hidden="true">fill</span>
    </button>
    <button class="sq" id="btn-ats" aria-label="ATS Score Tool" title="ATS Score Tool">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 19v-5M12 19V7M18 19v-9"/></svg>
      <span class="sq-cap" aria-hidden="true">score</span>
    </button>
    <!-- The Draft action carries the mark, /d on the orange, as on the job cards (D1). -->
    <button class="sq sq--primary" id="btn-resume" aria-label="Open draft" title="Open draft">
      <span class="draft-d" aria-hidden="true">/d</span>
    </button>
  </div>
  <div class="links">
    <button class="link" id="btn-linkedin">Sign in with LinkedIn</button>
    <button class="link" id="btn-settings">Keyboard shortcuts</button>
    <button class="link" id="btn-report-form" title="Tell draft this application form is not recognised">Report this form</button>
  </div>
  <!-- D55 decision E: what a report sends is shown BEFORE it is sent; Send is a second click. -->
  <div id="report-form" style="display:none">
    <p class="read-hint" id="report-form-line"></p>
    <div class="btn-row">
      <button class="btn" id="btn-report-send">Send report</button>
      <button class="link" id="btn-report-cancel">Cancel</button>
    </div>
  </div>

  <p class="result-text" id="last-capture" style="display:none"></p>
  <div class="links" id="capture-open-row" style="display:none"><button class="link" id="capture-open">Open it on draft</button></div>
  <p class="status" id="status"></p>

  <script src="config.js"></script>
  <script src="companion.js"></script>
  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- D23: the site's tokens (generated from client/src/styles/colorTokens.js, with the self-hosted
       faces) and the site's controls. ⛔ No colour literal here — test/colorLiteralGuard.test.js. -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 284px; padding: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .status { font-size: 11px; color: var(--c-ink-faint); margin-top: 8px; text-align: center; min-height: 14px; }
    .result-text { font-size: 11px; text-align: center; margin: 6px 0 0; }
    .result-text.success { color: var(--c-success); }
    .result-text.error   { color: var(--c-danger); }
    .result-text.warn    { color: var(--c-warning); }
    hr.divider { border: 0; border-top: 1px solid var(--c-border); margin: 12px 0; }

    /* WHO THE EXTENSION IS ACTING AS. Always rendered, never hidden behind a hover or a menu —
       an identity a user has to go looking for is not a visible one. */
    #identity {
      display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
      font-size: 11px; color: var(--c-ink-muted); margin: 0 0 12px; min-height: 14px;
    }
    #identity .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #identity .who strong { color: var(--c-ink); font-weight: 700; }
    #identity .not-admin { color: var(--c-ink-faint); }

    /* D23, THE MANUAL CONTEXT TRIGGER. Nothing about the page is read until this is pressed. */
    #btn-read-page { justify-content: space-between; }
    #btn-read-page .lbl { display: inline-flex; align-items: center; gap: 8px; }
    .read-hint { font-size: 11px; color: var(--c-ink-faint); margin: -2px 0 12px; }

    /* ⭐ T9: the ATS report — the component brings its own look (its shadow root); this only spaces it. */
    #ats-report { margin: 0 0 12px; }
    #ats-report-actions { margin-top: 8px; }
    /* ⭐ D63: the job card (ui.css .job) — shown once the page is read. */
    #job-preview { display: none; }
    #job-preview .job-text { min-width: 0; }

    /* D13, the companion: what this page is, and the one or two actions it calls for. */
    #companion { display: none; margin-bottom: 4px; }
    #companion .ctx-line { font-size: 11px; color: var(--c-ink-muted); margin: 0 0 8px; }
    #companion .ctx-line.saved { color: var(--c-success); }
    /* D63: on a posting and a form the line is said by the MARKS (#facts) and kept for screen readers. */
    #companion .ctx-line.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    #companion .questions { font-size: 11px; color: var(--c-ink); background: var(--c-danger-quiet);
      border-radius: 12px; padding: 7px 9px; margin: 0 0 10px; }
    .btn-row { display: flex; gap: 8px; }
    .btn-row .btn { flex: 1 1 0; }
    #recent { display: none; margin-bottom: 4px; }
    /* D64 · Captured today — shown only while automatic capture is on. */
    #auto-today { margin-bottom: 4px; }
    #auto-today summary { cursor: pointer; font-size: 12px; font-weight: 700; padding: 6px 0; }
    #auto-today ul { list-style: none; }
    #auto-today li { font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--c-border); display: flex; justify-content: space-between; gap: 8px; }
    #recent ul { list-style: none; }
    #recent li { font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--c-border);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--c-ink-muted); }
    #recent li .co { color: var(--c-ink); font-size: 13px; }
    .all-head { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
      color: var(--c-ink-faint); margin: 0 0 8px; }
    .squares { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .links { display: flex; justify-content: flex-start; gap: 8px; flex-wrap: wrap; }

    /* §8 row 15, decision D — THE TODAY RING: today against YOUR CAP, never a goal. */
    #today { display: none; align-items: center; gap: 7px; font-size: 11px; color: var(--c-ink-muted); }
    #today svg { width: 26px; height: 26px; transform: rotate(-90deg); }
    #today .ring-track { stroke: var(--c-border); }
    #today .ring-used { stroke: var(--c-accent); transition: stroke-dasharray .3s ease; }
    #today[data-full="true"] .ring-used { stroke: var(--c-warning); }
    #today b { color: var(--c-ink); font-weight: 700; }
    @media (prefers-reduced-motion: reduce) { #today .ring-used { transition: none; } }

    /* D56 + §8 row 10 — the on-demand company notice, and the manual route's "I submitted it". */
    #ctx-notice { font-size: 11px; color: var(--c-ink); background: var(--c-info-quiet);
      border-radius: 12px; padding: 7px 9px; margin: 0 0 10px; }
    #submitted-msg { font-size: 11px; color: var(--c-ink-muted); margin: -2px 0 8px; }

    /* §8 row 17 — THE COPY SHEET: the prepared answers, a copy button each. Nothing enters the page. */
    #copy-sheet { display: none; margin: 0 0 10px; }
    #copy-sheet ul { list-style: none; max-height: 220px; overflow: auto; }
    #copy-sheet li { display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
      padding: 6px 0; border-bottom: 1px solid var(--c-border); font-size: 12px; }
    #copy-sheet li .cs-k { display: block; color: var(--c-ink-muted); font-size: 11px; }
    #copy-sheet li .cs-v { display: block; color: var(--c-ink); font-weight: 700; word-break: break-word; }
    #copy-sheet li.elig .cs-k { color: var(--c-info); }
    #copy-sheet .cs-note { font-size: 11px; color: var(--c-ink-faint); margin: 6px 0 0; }

    /* ⭐ D96 §3 · progress */
    /* Where this tab's job stands, and the jobs in progress — what the browser REMEMBERS, read on open (D23: no page
       read, no server call). The job box is the packet summary's surface (.pk); the list is the recent captures'. */
    #progress .pg-job { font-size: 13px; font-weight: 700; color: var(--c-ink); margin: 0 0 3px; }
    #progress .pg-line { font-size: 11px; color: var(--c-ink-muted); margin: 0; }
    #in-progress { margin-bottom: 4px; }
    #in-progress ul { list-style: none; }
    #in-progress li { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 6px 0;
      border-bottom: 1px solid var(--c-border); }
    #in-progress li .ip-job { flex: 1 1 auto; min-width: 0; color: var(--c-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #in-progress li .ip-where { flex: 0 0 auto; color: var(--c-ink-muted); font-size: 11px; }
    #in-progress li.here .ip-job { font-weight: 700; }
    /* ⭐ D96 §3 end */
  </style>
</head>
<body>
  <div class="header">
    <span class="mark" role="img" aria-label="draft"><span class="mark-slash"></span><span class="mark-word"></span></span>
    <!-- §8 row 15 / decision D: today against your cap (the day's Draft slots) — never a goal. -->
    <span id="today" role="img" aria-label="">
      <svg viewBox="0 0 36 36" aria-hidden="true"><circle class="ring-track" cx="18" cy="18" r="15" fill="none" stroke-width="4"/><circle class="ring-used" id="today-arc" cx="18" cy="18" r="15" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 100" pathLength="100"/></svg>
      <span id="today-text"></span>
    </span>
  </div>

  <div id="identity">
    <span class="who" id="identity-who"></span>
    <button class="link" id="btn-disconnect" style="display:none">Disconnect</button>
  </div>

  <button class="btn btn-primary" id="btn-sign-in" style="display:none">Sign in to Draft</button>

  <!-- D23, THE MANUAL CONTEXT TRIGGER (owner, 10-04). Context detection is never automatic on popup
       open: until this is pressed, the popup shows the four actions below and nothing else, reads
       nothing from the page and asks the server nothing about it. -->
  <button class="btn" id="btn-read-page" style="display:none" aria-keyshortcuts="R"
          aria-describedby="read-hint">
    <span class="lbl">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      Read this page
    </span>
    <kbd>R</kbd>
  </button>
  <p class="read-hint" id="read-hint" style="display:none">Nothing on this page is read until you press it.</p>
  <!-- ⭐ Captured today: distinct jobs, any route — "2 today · 1 already on your board". -->
  <p class="read-hint" id="captured-today" style="display:none"></p>

  <!-- ⭐ D96 §3 · the popup REMEMBERS: this tab's job and where it stands, and the last five jobs in progress. Read from
       the extension's own storage on open (popup-progress.js) — nothing on the page is read, nothing is asked. -->
  <div id="progress" class="pk" hidden>
    <p class="pg-job" id="progress-job"></p>
    <p class="pg-line" id="progress-line"></p>
  </div>
  <div id="in-progress" hidden>
    <p class="all-head">In progress</p>
    <ul id="in-progress-list"></ul>
  </div>

  <!-- ⭐ D63 · THE JOB CARD: the paper logo tile (D61), the company in the logo face, the D50 number box. -->
  <div id="job-preview" class="job">
    <div class="tile" id="preview-tile" aria-hidden="true"></div>
    <div class="job-text">
      <div class="co logo-face" id="preview-company"></div>
      <div class="ti" id="preview-title"></div>
    </div>
    <div class="nb none" id="preview-score" role="img" aria-label="No ATS score yet"><small>ATS</small></div>
  </div>
  <!-- ⭐ T9 · THE WEB APP'S ATS REPORT — the one component (<draft-ats-report>, extension/atsReport.js = shared/
       atsReportElement.js bundled), drawn from the same JSON the web app gets, after the press only. The extension adds
       only its own buttons under it. -->
  <div id="ats-report" style="display:none">
    <draft-ats-report id="ats-report-card"></draft-ats-report>
    <div class="btn-row" id="ats-report-actions">
      <button class="btn" id="btn-ats-full" style="display:none">Full report in draft</button>
      <button class="btn" id="btn-ats-again">Read again</button>
    </div>
  </div>
  <!-- ⭐ D63 · status as MARKS (D60), and the packet before you fill. -->
  <div class="facts" id="facts" hidden></div>
  <div class="pk" id="packet-summary" hidden></div>

  <!-- D13, THE COMPANION. companion.js decides which of the four actions this page calls for — after
       the press above, never before. The four stay below ("Everything"): a wrong guess must never
       hide an action. -->
  <div id="companion">
    <!-- ⭐ The tab binding (owner 10-12): the job this tab is on, whatever stage of its application it shows. -->
    <div id="bound" style="display:none">
      <p class="ctx-line" id="bound-line"></p>
      <button class="link" id="btn-unbind">Unlink this page</button>
    </div>
    <p class="ctx-line" id="ctx-line"></p>
    <p class="questions" id="ctx-questions" style="display:none"></p>
    <p id="ctx-notice" style="display:none"></p>
    <button class="btn btn-primary" id="btn-fill-primary" style="display:none">Fill it <kbd>⌃⇧Y</kbd></button>
    <!-- D56: no packet, but a job of yours — one click prepares it and fills. -->
    <button class="btn btn-primary" id="btn-prepare" style="display:none">Prepare this application</button>
    <!-- D56: the manual route records its own submission — this page is the evidence. -->
    <button class="btn" id="btn-submitted" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg> I submitted it</button>
    <p id="submitted-msg" style="display:none"></p>
    <div class="btn-row" id="posting-actions" style="display:none">
      <!-- ⭐ D63 (7): Capture and Score side by side, the shortcut on the primary. -->
      <button class="btn btn-primary" id="btn-capture-primary">Capture it <kbd>⌃⇧K</kbd></button>
      <button class="btn" id="btn-score-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 19v-5M12 19V7M18 19v-9"/></svg> Score</button>
    </div>
  </div>
  <div id="copy-sheet">
    <p class="all-head">Copy sheet</p>
    <ul id="copy-sheet-list"></ul>
    <p class="cs-note" id="copy-sheet-note"></p>
  </div>
  <div id="recent">
    <p class="all-head">Your recent captures</p>
    <ul id="recent-list"></ul>
  </div>
  <details id="auto-today" hidden>
    <summary id="auto-today-head">Captured automatically today</summary>
    <ul id="auto-today-list"></ul>
  </details>

  <hr class="divider" id="all-divider" style="display:none">
  <p class="all-head" id="all-head" style="display:none">Everything</p>
  <div class="squares">
    <button class="sq" id="btn-capture-job" aria-label="Capture job" title="Capture job (Ctrl+Shift+K)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h10a1 1 0 0 1 1 1V21l-6-4-6 4V4.5a1 1 0 0 1 1-1z"/></svg>
      <span class="sq-cap" aria-hidden="true">capture</span>
    </button>
    <button class="sq" id="btn-fill" aria-label="Fill application" title="Fill application (Ctrl+Shift+Y)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h9l5 5v11H5z"/><path d="M14 4v5h5M8.5 13h7M8.5 16.5h4.5"/></svg>
      <span class="sq-cap" aria-hidden="true">fill</span>
    </button>
    <button class="sq" id="btn-ats" aria-label="ATS Score Tool" title="ATS Score Tool">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 19v-5M12 19V7M18 19v-9"/></svg>
      <span class="sq-cap" aria-hidden="true">score</span>
    </button>
    <!-- The Draft action carries the mark, /d on the orange, as on the job cards (D1). -->
    <button class="sq sq--primary" id="btn-resume" aria-label="Open draft" title="Open draft">
      <span class="draft-d" aria-hidden="true">/d</span>
    </button>
  </div>
  <!-- ⭐ D98 (J6): opens the Résumé panel ON THE PAGE for this tab's job — its own row, so the labels below keep one
       line. It generates nothing: the panel's own Generate button does. -->
  <div class="mini">
    <button class="mb" id="btn-resume-onpage" title="A résumé made for this job, on the page — generated only when you press Generate there">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 15.5h7M9 19h4"/></svg> Résumé for this job</button>
  </div>
  <!-- ⭐ D63 (5): the text links go. Copy sheet and Report form are depth boxes under Everything, with More
       (the options page, where Sign in with LinkedIn and Keyboard shortcuts now live — they are used once). -->
  <div class="mini">
    <button class="mb" id="btn-copy-sheet" title="Your prepared answers, to copy by hand on a portal draft cannot fill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg> Copy sheet</button>
    <button class="mb" id="btn-report-form" title="Tell draft this application form is not recognised">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg> Report form</button>
    <button class="mb" id="btn-settings" title="Sign in with LinkedIn, keyboard shortcuts and automatic capture">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 12h.01M12 12h.01M18 12h.01"/></svg> More</button>
  </div>
  <!-- D55 decision E: what a report sends is shown BEFORE it is sent; Send is a second click. -->
  <div id="report-form" style="display:none">
    <p class="read-hint" id="report-form-line"></p>
    <div class="btn-row">
      <button class="btn" id="btn-report-send">Send report</button>
      <button class="link" id="btn-report-cancel">Cancel</button>
    </div>
  </div>

  <p class="result-text" id="last-capture" style="display:none"></p>
  <div class="links" id="capture-open-row" style="display:none"><button class="link" id="capture-open">Open it on draft</button></div>
  <p class="status" id="status"></p>

  <script src="config.js"></script>
  <script src="atsReport.js"></script>
  <script src="companion.js"></script>
  <script src="popup.js"></script>
  <script type="module" src="popup-auto.js"></script>
  <script type="module" src="popup-progress.js"></script>
  <script type="module" src="popup-resume.js"></script>
</body>
</html>

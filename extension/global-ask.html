<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>draft — Read job postings?</title>
  <!-- ⭐ D112 b2: the ONE global-read ask — a small window over the posting that closes itself on either answer.
       D23: the site's tokens and controls. ⛔ No colour literal here. ⛔ D60: rectangles only. -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="ui.css">
  <style>
    body { padding: 20px 22px; }
    .mark { margin-bottom: 12px; }
    h1 { font-size: 17px; margin-bottom: 8px; }
    .lead { font-size: 13px; line-height: 1.5; margin-bottom: 8px; }
    .points { font-size: 12px; line-height: 1.5; color: var(--c-ink-muted); padding-left: 16px; margin: 0 0 10px; }
    .points li + li { margin-top: 4px; }
    .promise { font-size: 12px; font-weight: 700; line-height: 1.5; border-left: 3px solid var(--c-accent); border-radius: 6px;
      padding: 8px 10px; background: var(--c-surface-2); margin-bottom: 14px; }
    .btn-row { display: flex; gap: 8px; }
    .btn-row .btn { margin-bottom: 0; }
    .status { font-size: 12px; color: var(--c-ink-muted); margin-top: 10px; min-height: 16px; }
  </style>
</head>
<body>
  <span class="mark" role="img" aria-label="draft"><span class="mark-slash"></span><span class="mark-word"></span></span>
  <h1 id="ask-title"></h1>
  <p class="lead" id="ask-lead"></p>
  <ul class="points" id="ask-points"></ul>
  <p class="promise" id="ask-promise"></p>
  <div class="btn-row">
    <button class="btn btn-primary" id="ask-allow" type="button"></button>
    <button class="btn" id="ask-later" type="button"></button>
  </div>
  <p class="status" id="ask-status" role="status"></p>
  <script type="module" src="global-ask.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ask draft</title>
  <!-- ⭐ D191 (2e) / (3) / P5 · the extension's own panel: the person's day, a search of draft's board, and TINY (the
       engine shared with the site — assistantEngine.js, mirrored). ⭐ 46n (owner 11-15: "make tiny a floating bot … give it
       a cute logo animal"): the chat is Tiny, with the fox (tinyMascot.js, mirrored from draft's shared/) in its header —
       the same name and face as on draft and the PDF-tools site. D23: the site's tokens and controls. ⛔ No colour
       literal here (the fox's own colours are illustration, in tinyMascot.js). ⛔ D60: rectangles only — the fox's well is
       a perfect circle. ⛔ Nothing here calls a model: T1 / T2 run from draft's own data. -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="ui.css">
  <style>
    body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-height: 100vh; box-sizing: border-box; }
    /* ⭐ D191 (2a)–(2d), 46o: what draft knows about this tab's posting and its employer — draft's own data, no model */
    .card { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--c-border); border-radius: 10px; background: var(--c-surface-2); }
    .card[hidden] { display: none; }
    .card-head { display: flex; align-items: center; gap: 10px; }
    .card-head img { width: 28px; height: 28px; border-radius: 6px; object-fit: contain; background: var(--c-surface-solid); flex-shrink: 0; }
    .card-head div { display: grid; gap: 1px; min-width: 0; }
    .card-head b { font-size: 14px; overflow-wrap: anywhere; }
    .card-head span, .fact { font-size: 12px; color: var(--c-ink-muted); line-height: 1.45; margin: 0; overflow-wrap: anywhere; }
    .fact:empty { display: none; }
    .fit { font-size: 13px; font-weight: 700; margin: 0; }
    .fit:empty { display: none; }
    .state { font-size: 12px; margin: 0; display: flex; align-items: center; gap: 6px; }
    .state:empty { display: none; }
    .state::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--c-ink-faint); flex-shrink: 0; }
    .state[data-state="Needs you"]::before { background: var(--c-warning); }
    .state[data-state="Sent"]::before { background: var(--c-success); }
    .state[data-state="Failed"]::before { background: var(--c-danger); }
    .acts { display: flex; flex-wrap: wrap; gap: 6px; }
    .acts .btn { margin-bottom: 0; }
    .links { display: flex; gap: 12px; font-size: 12px; }
    .links a { color: var(--c-ink-muted); text-decoration: none; }
    .mark { margin-bottom: 2px; }
    .day { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .day a { display: grid; gap: 2px; padding: 8px; border: 1px solid var(--c-border); border-radius: 8px; background: var(--c-surface-2); color: var(--c-ink); text-decoration: none; }
    .day b { font-size: 18px; }
    .day span { font-size: 11px; color: var(--c-ink-muted); }
    form.row { display: flex; gap: 8px; margin: 0; }
    form.row input, form.row textarea { flex: 1; border: 1px solid var(--c-border-control); border-radius: 8px; background: var(--c-surface-input); color: var(--c-ink); padding: 7px 9px; font: inherit; font-size: 13px; resize: none; }
    form.row .btn { margin-bottom: 0; }
    /* 46p: in the side panel (320 px) Speak + Ask crushed the text box — it takes its own line, the buttons below */
    #ask-form { flex-wrap: wrap; }
    #ask-form textarea { flex: 1 1 100%; min-width: 0; }
    #ask-form .btn { flex: 1 1 0; }
    .turns { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: grid; gap: 8px; align-content: start; flex: 1; min-height: 120px; }
    .turn { padding: 8px 10px; border-radius: 8px; background: var(--c-surface-2); font-size: 13px; line-height: 1.45; white-space: pre-wrap; }
    .turn[data-who="you"] { justify-self: end; background: var(--c-surface-solid); }
    .label { display: block; font-size: 11px; color: var(--c-ink-faint); margin-bottom: 2px; }
    .note { font-size: 11px; color: var(--c-ink-muted); margin: 0; min-height: 0; }
    .note:empty { display: none; }
    .confirm { display: flex; gap: 6px; margin-top: 6px; }
    .confirm .btn { margin-bottom: 0; }
    .tiny-head { display: flex; align-items: center; gap: 8px; }
    .tiny-face { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--c-surface-2); flex-shrink: 0; }
    .tiny-face svg { display: block; }
    .tiny-who { display: grid; gap: 1px; }
    .tiny-who span { font-size: 11px; color: var(--c-ink-muted); }
    h2 { font-size: 13px; margin: 0; }
  </style>
</head>
<body>
  <span class="mark" role="img" aria-label="draft"><span class="mark-slash"></span><span class="mark-word"></span></span>
  <nav class="day" id="ask-day" aria-label="Your day"></nav>
  <!-- ⭐ D191 (2a) / (2b) / (2c): this tab's posting, from the press's read -->
  <section class="card" id="ask-job" hidden aria-label="This job">
    <div class="card-head"><div><b id="ask-job-title"></b><span id="ask-job-sub"></span></div></div>
    <p class="fit" id="ask-job-fit"></p>
    <p class="fact" id="ask-job-works"></p>
    <p class="state" id="ask-job-state"></p>
    <div class="acts" id="ask-job-acts"></div>
  </section>
  <!-- ⭐ D191 (2d): the employer -->
  <section class="card" id="ask-company" hidden aria-label="The company">
    <div class="card-head"><img id="ask-company-logo" alt="" hidden><div><b id="ask-company-name"></b><span id="ask-company-about"></span></div></div>
    <p class="fact" id="ask-company-facts"></p>
    <div class="acts" id="ask-company-acts"></div>
  </section>
  <p class="note" id="ask-nojob">Press the toolbar icon on a job posting to see what draft knows about it here.</p>
  <!-- ⭐ A211 (1a): the runner tab — fill the applications sent from your browser, then one press sends them -->
  <button class="btn" id="ask-runner" type="button">Apply while this is open</button>
  <form class="row" id="ask-search" role="search">
    <input id="ask-search-input" type="search" maxlength="200" placeholder="Search draft's jobs — e.g. backend jobs in Boston" aria-label="Search draft's jobs">
    <button class="btn" type="submit">Search</button>
  </form>
  <!-- ⭐ D191 (3): Open draft (the PDF-tools site's link is NOT here — the brand guard forbids its name and host in this
       product's files; the owner decides, 46o) -->
  <nav class="links" aria-label="Open"><a id="ask-open-draft" href="https://jobsviadraft.com/app" target="_blank" rel="noopener">Open draft</a><a id="ask-open-home" href="https://jobsviadraft.com/app/auto-apply" target="_blank" rel="noopener">Your applications</a></nav>
  <header class="tiny-head">
    <span class="tiny-face" id="ask-tiny-face" aria-hidden="true"></span>
    <div class="tiny-who"><h2 id="ask-tiny-name">draft</h2><span>Acts on draft and answers from your own data — no AI.</span></div>
  </header>
  <ol class="turns" id="ask-turns" aria-live="polite"></ol>
  <div>
    <form class="row" id="ask-form">
      <textarea id="ask-input" rows="2" maxlength="600" placeholder="e.g. draft this job · does this company sponsor? · how many need me?" aria-label="Tell draft what to do"></textarea>
      <button class="btn" id="ask-mic" type="button" hidden aria-pressed="false" aria-label="Speak a command" title="Speak a command">Speak</button>
      <button class="btn btn-primary" type="submit" id="ask-send">Ask</button>
    </form>
    <p class="note" id="ask-voice-note" role="status"></p>
  </div>
  <script type="module" src="ask.js"></script>
</body>
</html>

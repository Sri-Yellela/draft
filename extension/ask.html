<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>draft — Ask draft</title>
  <!-- ⭐ D191 (2e) / (3) / P5 · the extension's own panel: the person's day, a search of draft's board, and Ask draft (the
       engine shared with the site — assistantEngine.js, mirrored). D23: the site's tokens and controls. ⛔ No colour
       literal here. ⛔ D60: rectangles only. ⛔ Nothing here calls a model: T1 / T2 run from draft's own data. -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="ui.css">
  <style>
    body { padding: 16px 18px; display: grid; gap: 12px; min-height: 100vh; box-sizing: border-box; grid-template-rows: auto auto auto 1fr auto; }
    .mark { margin-bottom: 2px; }
    .day { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .day a { display: grid; gap: 2px; padding: 8px; border: 1px solid var(--c-border); border-radius: 8px; background: var(--c-surface-2); color: var(--c-ink); text-decoration: none; }
    .day b { font-size: 18px; }
    .day span { font-size: 11px; color: var(--c-ink-muted); }
    form.row { display: flex; gap: 8px; margin: 0; }
    form.row input, form.row textarea { flex: 1; border: 1px solid var(--c-border-control); border-radius: 8px; background: var(--c-surface-input); color: var(--c-ink); padding: 7px 9px; font: inherit; font-size: 13px; resize: none; }
    form.row .btn { margin-bottom: 0; }
    .turns { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: grid; gap: 8px; align-content: start; }
    .turn { padding: 8px 10px; border-radius: 8px; background: var(--c-surface-2); font-size: 13px; line-height: 1.45; white-space: pre-wrap; }
    .turn[data-who="you"] { justify-self: end; background: var(--c-surface-solid); }
    .label { display: block; font-size: 11px; color: var(--c-ink-faint); margin-bottom: 2px; }
    .note { font-size: 11px; color: var(--c-ink-muted); margin: 0; min-height: 0; }
    .note:empty { display: none; }
    .confirm { display: flex; gap: 6px; margin-top: 6px; }
    .confirm .btn { margin-bottom: 0; }
    h2 { font-size: 13px; margin: 0; }
  </style>
</head>
<body>
  <span class="mark" role="img" aria-label="draft"><span class="mark-slash"></span><span class="mark-word"></span></span>
  <nav class="day" id="ask-day" aria-label="Your day"></nav>
  <form class="row" id="ask-search" role="search">
    <input id="ask-search-input" type="search" maxlength="200" placeholder="Search draft's jobs — e.g. backend jobs in Boston" aria-label="Search draft's jobs">
    <button class="btn" type="submit">Search</button>
  </form>
  <h2>Ask draft</h2>
  <ol class="turns" id="ask-turns" aria-live="polite"></ol>
  <div>
    <form class="row" id="ask-form">
      <textarea id="ask-input" rows="2" maxlength="600" placeholder="e.g. draft this job · does this company sponsor? · how many need me?" aria-label="Tell draft what to do"></textarea>
      <button class="btn" id="ask-mic" type="button" hidden aria-pressed="false" aria-label="Speak a command" title="Speak a command">Speak</button>
      <button class="btn btn-primary" type="submit" id="ask-send">Ask</button>
    </form>
    <p class="note" id="ask-voice-note" role="status"></p>
  </div>
  <script type="module" src="ask.js"></script>
</body>
</html>

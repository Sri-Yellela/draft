.at-in{animation:atIn .35s cubic-bezier(.2,.8,.2,1) both}
.at-draw{stroke-dasharray:900;stroke-dashoffset:900;animation:atDraw 3.2s cubic-bezier(.4,0,.2,1) .3s forwards}
.at-march{animation:atMarch 1.4s linear infinite}
.at-tick{animation:atTick 1.2s ease-in-out infinite}
.at-stamp{animation:atStamp .3s cubic-bezier(.2,.8,.2,1) both}
.at-plate{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.at-plate:hover{transform:translate(-3px,-3px);box-shadow:7px 7px 0 #1B1B1B}
.at-link:hover{background:#EDE5DE}

@media (prefers-reduced-motion: reduce){.at-bob1,.at-bob2,.at-bob3,.at-drop,.at-in,.at-march,.at-tick,.at-stamp{animation:none}.at-draw{animation:none;stroke-dashoffset:0}}

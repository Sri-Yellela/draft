<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Region emblem</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{ px }}; height: {{ px }}; line-height: 0">
<sc-if value="{{ isFound }}" hint-placeholder-val="{{ false }}">
<svg role="img" aria-label="Foundations emblem: a chip" width="100%" height="100%" viewBox="0 0 120 120">
<rect width="120" height="120" rx="22" fill="#F6E1D8"></rect>
<g stroke="#EBC8B9" stroke-width="1"><path d="M0 30H120M0 60H120M0 90H120M30 0V120M60 0V120M90 0V120"></path></g>
<g fill="none" stroke="#1B1B1B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M28 60 L14 67 V98"></path><path d="M92 60 L106 67 V24"></path><path d="M60 80 V106"></path><path d="M40 68 L32 72 V86"></path></g>
<g fill="#FFFFFF" stroke="#1B1B1B" stroke-width="1.4"><circle cx="14" cy="98" r="3.5"></circle><circle cx="60" cy="106" r="3.5"></circle><circle cx="32" cy="86" r="3"></circle></g>
<circle cx="106" cy="24" r="4" fill="#C2593A" stroke="#1B1B1B" stroke-width="1.4"><animate attributeName="r" values="4;5.5;4" dur="1.6s" repeatCount="indefinite"></animate></circle>
<g stroke="#1B1B1B" stroke-width="1.4" stroke-linejoin="round">
<polygon points="24,50 60,70 60,82 24,62" fill="#8E3D25"></polygon>
<polygon points="60,70 96,50 96,62 60,82" fill="#A84A2E"></polygon>
<polygon points="60,30 96,50 60,70 24,50" fill="#C2593A"></polygon>
<polygon points="60,41 77,50 60,59 43,50" fill="#F6E1D8"></polygon>
</g>
<g stroke="#1B1B1B" stroke-width="1" fill="none"><path d="M52 45.5 L68 54.5M48 47.5 L64 56.5M56 43.5 L72 52.5"></path></g>
</svg>
</sc-if>
<sc-if value="{{ isBits }}" hint-placeholder-val="{{ false }}">
<svg role="img" aria-label="Part 2 emblem: stacked layers" width="100%" height="100%" viewBox="0 0 120 120">
<rect width="120" height="120" rx="22" fill="#E6E3F6"></rect>
<g stroke="#1B1B1B" stroke-width="1.4" stroke-linejoin="round">
<polygon points="28,74 60,90 60,98 28,82" fill="#2E2675"></polygon><polygon points="60,90 92,74 92,82 60,98" fill="#3B3290"></polygon><polygon points="60,58 92,74 60,90 28,74" fill="#FFFFFF"></polygon>
<polygon points="28,54 60,70 60,78 28,62" fill="#2E2675"></polygon><polygon points="60,70 92,54 92,62 60,78" fill="#3B3290"></polygon><polygon points="60,38 92,54 60,70 28,54" fill="#8A80DA"></polygon>
<polygon points="28,34 60,50 60,58 28,42" fill="#2E2675"></polygon><polygon points="60,50 92,34 92,42 60,58" fill="#3B3290"></polygon><polygon points="60,18 92,34 60,50 28,34" fill="#4B3FA8"></polygon>
</g>
<g fill="#FFFFFF" stroke="#1B1B1B" stroke-width="1"><polygon points="60,27 70,32 60,37 50,32"></polygon></g>
<g stroke="#1B1B1B" stroke-width="1.2"><rect x="22" y="104" width="7" height="7" fill="#4B3FA8"></rect><rect x="33" y="104" width="7" height="7" fill="#FFFFFF"></rect><rect x="44" y="104" width="7" height="7" fill="#4B3FA8"></rect><rect x="55" y="104" width="7" height="7" fill="#4B3FA8"></rect><rect x="66" y="104" width="7" height="7" fill="#FFFFFF"></rect><rect x="77" y="104" width="7" height="7" fill="#4B3FA8"></rect><rect x="88" y="104" width="7" height="7" fill="#FFFFFF"><animate attributeName="fill" values="#FFFFFF;#4B3FA8;#FFFFFF" dur="2s" repeatCount="indefinite"></animate></rect></g>
</svg>
</sc-if>
<sc-if value="{{ isTree }}" hint-placeholder-val="{{ false }}">
<svg role="img" aria-label="Algorithms emblem: a search tree" width="100%" height="100%" viewBox="0 0 120 120">
<rect width="120" height="120" rx="22" fill="#F5E2D6"></rect>
<g stroke="#D9AE97" stroke-width="2" fill="none" stroke-linecap="round"><path d="M60 26 L34 58M34 58 L20 90M34 58 L46 90M86 58 L100 90"></path></g>
<g stroke="#1B1B1B" stroke-width="3" fill="none" stroke-linecap="round"><path d="M60 26 L86 58 L74 90"></path></g>
<g stroke="#B4532A" stroke-width="1.6" fill="#FFFFFF"><circle cx="34" cy="58" r="8"></circle><circle cx="20" cy="90" r="7"></circle><circle cx="46" cy="90" r="7"></circle><circle cx="100" cy="90" r="7"></circle></g>
<g stroke="#1B1B1B" stroke-width="1.6" fill="#B4532A"><circle cx="60" cy="26" r="9"></circle><circle cx="86" cy="58" r="8"></circle><circle cx="74" cy="90" r="8"></circle></g>
<circle cx="74" cy="90" r="12" fill="none" stroke="#1B1B1B" stroke-width="1.2" stroke-dasharray="3 3"><animateTransform attributeName="transform" type="rotate" from="0 74 90" to="360 74 90" dur="6s" repeatCount="indefinite"></animateTransform></circle>
</svg>
</sc-if>
<sc-if value="{{ isNet }}" hint-placeholder-val="{{ true }}">
<svg role="img" aria-label="Systems and networks emblem: a connected globe" width="100%" height="100%" viewBox="0 0 120 120">
<rect width="120" height="120" rx="22" fill="#DFE6F0"></rect>
<ellipse cx="60" cy="62" rx="54" ry="16" fill="none" stroke="#1B1B1B" stroke-width="1.2" transform="rotate(-18 60 62)"></ellipse>
<circle cx="60" cy="60" r="36" fill="#1F3A63" stroke="#1B1B1B" stroke-width="1.6"></circle>
<g fill="none" stroke="#5D79A3" stroke-width="1"><ellipse cx="60" cy="60" rx="14" ry="36"></ellipse><ellipse cx="60" cy="60" rx="27" ry="36"></ellipse><path d="M26 48 H94 M24 60 H96 M26 72 H94"></path></g>
<path d="M36 46 Q58 12 86 44" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" values="16;0" dur="1.2s" repeatCount="indefinite"></animate></path>
<path d="M42 80 Q70 92 88 70" fill="none" stroke="#FFFFFF" stroke-width="1.6"></path>
<g fill="#C2593A" stroke="#FFFFFF" stroke-width="1.6"><circle cx="36" cy="46" r="4"></circle><circle cx="86" cy="44" r="4"></circle><circle cx="42" cy="80" r="3.5"></circle><circle cx="88" cy="70" r="3.5"></circle></g>
<ellipse cx="60" cy="62" rx="54" ry="16" fill="none" stroke="#1B1B1B" stroke-width="1.2" stroke-dasharray="0 60 200" transform="rotate(-18 60 62)"></ellipse>
</svg>
</sc-if>
<sc-if value="{{ isLock }}" hint-placeholder-val="{{ false }}">
<svg role="img" aria-label="Security and money emblem: a lock and coins" width="100%" height="100%" viewBox="0 0 120 120">
<rect width="120" height="120" rx="22" fill="#EDE2EF"></rect>
<g stroke="#1B1B1B" stroke-width="1.4"><path d="M18 90 V98 A18 6 0 0 0 54 98 V90" fill="#B8913A"></path><ellipse cx="36" cy="90" rx="18" ry="6" fill="#E3BE62"></ellipse><path d="M18 80 V88 A18 6 0 0 0 54 88 V80" fill="#B8913A"></path><ellipse cx="36" cy="80" rx="18" ry="6" fill="#E3BE62"></ellipse><path d="M18 70 V78 A18 6 0 0 0 54 78 V70" fill="#B8913A"></path><ellipse cx="36" cy="70" rx="18" ry="6" fill="#E3BE62"></ellipse></g>
<path d="M68 52 V40 A13 13 0 0 1 94 40 V52" fill="none" stroke="#1B1B1B" stroke-width="6" stroke-linecap="round"></path>
<path d="M68 52 V40 A13 13 0 0 1 94 40 V52" fill="none" stroke="#9C74A3" stroke-width="2.5" stroke-linecap="round"></path>
<rect x="58" y="50" width="46" height="44" rx="7" fill="#6A3E73" stroke="#1B1B1B" stroke-width="1.6"></rect>
<path d="M58 62 H104" stroke="#4E2C56" stroke-width="1.2"></path>
<circle cx="81" cy="72" r="5" fill="#F4EFE9" stroke="#1B1B1B" stroke-width="1.2"></circle><rect x="79" y="74" width="4" height="10" rx="1" fill="#F4EFE9" stroke="#1B1B1B" stroke-width="1.2"></rect>
<g stroke="#1B1B1B" stroke-width="1.4" fill="#C2593A"><path d="M24 28 l4 -8 l4 8 l-4 8 z"><animateTransform attributeName="transform" type="rotate" values="0 28 28;15 28 28;0 28 28" dur="3s" repeatCount="indefinite"></animateTransform></path></g>
</svg>
</sc-if>
<sc-if value="{{ isCode }}" hint-placeholder-val="{{ false }}">
<svg role="img" aria-label="Languages and media emblem: code and a waveform" width="100%" height="100%" viewBox="0 0 120 120">
<rect width="120" height="120" rx="22" fill="#DDEDF0"></rect>
<rect x="16" y="20" width="88" height="62" rx="8" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="1.6"></rect>
<path d="M16 33 H104" stroke="#1B1B1B" stroke-width="1.4"></path>
<g fill="#1B1B1B"><circle cx="25" cy="26.5" r="2"></circle><circle cx="32" cy="26.5" r="2"></circle><circle cx="39" cy="26.5" r="2"></circle></g>
<g fill="none" stroke="#2F6B7A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M46 46 L36 57 L46 68"></path><path d="M74 46 L84 57 L74 68"></path></g>
<path d="M64 44 L56 70" stroke="#1B1B1B" stroke-width="3" stroke-linecap="round"></path>
<g fill="#2F6B7A" stroke="#1B1B1B" stroke-width="1"><rect x="22" y="98" width="6" height="8" rx="2"></rect><rect x="32" y="92" width="6" height="14" rx="2"></rect><rect x="42" y="88" width="6" height="18" rx="2"><animate attributeName="height" values="18;8;18" dur="1.1s" repeatCount="indefinite"></animate><animate attributeName="y" values="88;98;88" dur="1.1s" repeatCount="indefinite"></animate></rect><rect x="52" y="94" width="6" height="12" rx="2"></rect><rect x="62" y="90" width="6" height="16" rx="2"></rect><rect x="72" y="96" width="6" height="10" rx="2"></rect><rect x="82" y="92" width="6" height="14" rx="2"></rect><rect x="92" y="99" width="6" height="7" rx="2"></rect></g>
</svg>
</sc-if>
<sc-if value="{{ isWorld }}" hint-placeholder-val="{{ false }}">
<svg role="img" aria-label="The physical world emblem: contour lines and a summit" width="100%" height="100%" viewBox="0 0 120 120">
<rect width="120" height="120" rx="22" fill="#EFE6D6"></rect>
<g fill="none" stroke="#B99B6A" stroke-width="1.2"><path d="M8 84 C20 60 34 50 50 44 C70 36 86 42 100 58 C110 70 114 86 112 104"></path><path d="M16 96 C26 70 40 60 56 56 C74 52 88 60 96 74 C102 84 102 96 100 106"></path></g>
<g fill="none" stroke="#7A5A2A" stroke-width="1.5"><path d="M30 92 C34 74 46 64 60 62 C74 60 84 70 86 84 C88 96 80 104 66 104 C48 104 28 104 30 92 Z" fill="#E2D2B6"></path><path d="M42 88 C46 78 52 72 60 72 C70 72 76 80 76 88 C76 96 68 98 60 98 C50 98 40 96 42 88 Z" fill="#C9AF83"></path></g>
<path d="M52 86 C54 82 58 80 62 80 C68 80 70 86 66 90 C62 92 54 92 52 86 Z" fill="#7A5A2A" stroke="#1B1B1B" stroke-width="1.4"></path>
<path d="M60 84 V40" stroke="#1B1B1B" stroke-width="1.6" stroke-linecap="round"></path>
<path d="M60 40 L82 47 L60 54 Z" fill="#C2593A" stroke="#1B1B1B" stroke-width="1.4" stroke-linejoin="round"><animateTransform attributeName="transform" type="skewY" values="0;-4;0" dur="2.4s" repeatCount="indefinite"></animateTransform></path>
<g fill="#1B1B1B"><circle cx="24" cy="28" r="1.6"></circle><circle cx="36" cy="22" r="1.2"></circle><circle cx="96" cy="26" r="1.6"></circle></g>
</svg>
</sc-if>
<sc-if value="{{ isMind }}" hint-placeholder-val="{{ false }}">
<svg role="img" aria-label="Intelligence emblem: a neural lattice" width="100%" height="100%" viewBox="0 0 120 120">
<rect width="120" height="120" rx="22" fill="#E9EBDB"></rect>
<g stroke="#B7BA92" stroke-width="1" fill="none"><path d="M22 34 L60 26M22 34 L60 48M22 34 L60 70M22 34 L60 92M22 60 L60 26M22 60 L60 48M22 60 L60 92M22 86 L60 26M22 86 L60 48M22 86 L60 70M22 86 L60 92M60 26 L98 46M60 26 L98 74M60 48 L98 74M60 70 L98 46M60 92 L98 46M60 92 L98 74"></path></g>
<g stroke="#1B1B1B" stroke-width="2.2" fill="none" stroke-linecap="round"><path d="M22 60 L60 70 L98 46"></path></g>
<g fill="#FFFFFF" stroke="#5A5F2E" stroke-width="1.6"><circle cx="22" cy="34" r="6"></circle><circle cx="22" cy="86" r="6"></circle><circle cx="60" cy="26" r="6"></circle><circle cx="60" cy="48" r="6"></circle><circle cx="60" cy="92" r="6"></circle><circle cx="98" cy="74" r="6"></circle></g>
<g fill="#5A5F2E" stroke="#1B1B1B" stroke-width="1.6"><circle cx="22" cy="60" r="7"></circle><circle cx="60" cy="70" r="8"></circle><circle cx="98" cy="46" r="7"></circle></g>
<circle cx="60" cy="70" r="8" fill="none" stroke="#5A5F2E" stroke-width="1.5"><animate attributeName="r" values="8;18" dur="1.8s" repeatCount="indefinite"></animate><animate attributeName="opacity" values="1;0" dur="1.8s" repeatCount="indefinite"></animate></circle>
</svg>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["found","bits","tree","net","lock","code","world","mind"],"default":"net"},"size":{"editor":"int","default":120},"$preview":{"width":120,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    var k = this.props.kind ?? 'net';
    return {
      px: (this.props.size ?? 120) + 'px',
      isFound: k === 'found', isBits: k === 'bits', isTree: k === 'tree', isNet: k === 'net',
      isLock: k === 'lock', isCode: k === 'code', isWorld: k === 'world', isMind: k === 'mind'
    };
  }
}
</script>
</body>
</html>

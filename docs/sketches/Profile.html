<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>draft — Profile (sketch)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
  --bg:#1B1B1B;--card:#262626;--raise:#2F2F2F;--raise2:#363636;--line:#363636;--ink:#FFFFFF;--body:#A3A3A3;--muted:#777777;
  --accent:#FBD3C4;--accent2:#F2C2B2;--on-accent:#1B1B1B;--glow:rgba(251,211,196,.16);--ok:#8FD6A8;
  --font:"Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Instrument Serif",Georgia,serif}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#F7F3F0;--card:#FFFFFF;--raise:#F1ECE8;--raise2:#E9E2DC;--line:#E6DED8;--ink:#1B1B1B;--body:#55504C;--muted:#8A837D;--accent:#C2593A;--accent2:#AD4C30;--on-accent:#FFFFFF;--glow:rgba(194,89,58,.16);--ok:#1E7A43}}
:root[data-theme="light"]{color-scheme:light;--bg:#F7F3F0;--card:#FFFFFF;--raise:#F1ECE8;--raise2:#E9E2DC;--line:#E6DED8;--ink:#1B1B1B;--body:#55504C;--muted:#8A837D;--accent:#C2593A;--accent2:#AD4C30;--on-accent:#FFFFFF;--glow:rgba(194,89,58,.16);--ok:#1E7A43}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.tint{background:color-mix(in srgb,var(--accent) 14%,transparent)}
/* the site's dock, collapsed, for context */
.rail{position:fixed;left:12px;top:50%;transform:translateY(-50%);width:60px;background:var(--card);border-radius:22px;padding:8px;display:grid;gap:6px;z-index:5}
.rail span{height:44px;border-radius:14px;display:grid;place-items:center;color:var(--accent);font:800 italic 18px/1 var(--font)}
.rail span.on{background:var(--raise)}
.rail svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* Atlas: its own navigation + panels, one centred group */
.atlas{display:grid;grid-template-columns:232px minmax(0,1fr);gap:clamp(20px,3vw,40px);max-width:1280px;margin:0 auto;padding:32px clamp(16px,3vw,40px) 80px 96px}
@media (max-width:900px){.atlas{grid-template-columns:1fr;padding-left:84px}}
.nav{position:sticky;top:28px;align-self:start;background:var(--card);border-radius:28px;padding:20px 12px 16px}
.nav .eb{color:var(--accent);font-size:13px;margin:0 10px 4px}
.nav h1{font:400 34px/1 var(--serif);margin:0 10px 16px}
.nav h3{font:500 12px/1 var(--font);color:var(--muted);margin:14px 10px 6px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;width:100%;box-sizing:border-box;padding:9px 10px;border-radius:13px;color:var(--body);font-size:14.5px}
.nav button:hover{background:var(--raise);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--raise);color:var(--ink)}
.nav button small{color:var(--muted);font-size:12px}
.nav button[aria-current="page"] small{color:var(--accent)}
@media (max-width:900px){.nav{position:static}}
.panel{animation:fi .3s ease;min-width:0}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{color:var(--accent);font-size:14px;margin:4px 0 8px}
h2{font-weight:500;font-size:44px;line-height:1.02;letter-spacing:-.035em;margin:0 0 10px}
.lead{color:var(--body);font-size:17px;margin:0 0 24px;max-width:60ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:0 0 22px}
.st{background:var(--card);border-radius:22px;padding:18px}
.st b{display:block;color:var(--accent);font-size:32px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.st span{color:var(--body);font-size:13.5px}
.card{background:var(--card);border-radius:28px;padding:22px;margin:0 0 14px}
.card h4{margin:0 0 6px;font-weight:600;font-size:16px}
.card p{margin:0;color:var(--body)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--raise);color:var(--ink)}
.btn:hover{background:var(--raise2)}
.btn.p{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--on-accent);box-shadow:0 10px 26px var(--glow)}
.quiet{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
@media (max-width:1100px){.two{grid-template-columns:1fr}}
/* the map */
.map{background:var(--card);border-radius:28px;padding:10px;overflow:hidden}
.map svg{width:100%;height:auto;display:block}
.map text{font:500 12px var(--font);fill:var(--body)}
.map .you text{fill:var(--on-accent);font-weight:700}
.key{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin:10px 6px 4px}
.key span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--k)}
/* skills list */
.seg{display:inline-flex;background:var(--card);border-radius:14px;padding:3px;margin:0 0 14px}
.seg button{all:unset;cursor:pointer;padding:7px 14px;border-radius:11px;color:var(--body);font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink)}
.sk{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.sk:first-of-type{border-top:0}
.sk b{font-weight:500}
.sk small{display:block;color:var(--muted);font-size:12.5px}
.state{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--body)}
.state::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc)}
.addsk{display:flex;gap:8px;margin-top:12px}
.addsk input{flex:1;background:var(--raise);border:0;border-radius:13px;padding:11px 13px;color:var(--ink)}
.check{display:none;background:var(--raise);border-radius:18px;padding:14px 16px;margin:6px 0 10px}
.check.on{display:block;animation:fi .25s ease}
.check p{margin:0 0 10px;color:var(--body)}
.check .opts{display:grid;gap:6px}
.check .opts button{all:unset;cursor:pointer;background:var(--card);border-radius:12px;padding:10px 12px;font-size:14px}
.check .opts button:hover{background:var(--raise2)}
/* route stack */
.stack{display:flex;flex-direction:column-reverse;gap:8px}
.step{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border-radius:20px;padding:14px 16px}
.step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--raise2);color:var(--body);font-weight:600;font-size:13px}
.step.done .n{background:var(--ok);color:#0b2a17}
.step.now{outline:1.5px solid var(--accent)}
.step.now .n{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--on-accent)}
.step b{font-weight:600}
.step p{margin:2px 0 0;color:var(--body);font-size:13.5px}
.found{background:var(--raise);border-radius:20px;padding:14px 16px;color:var(--body)}
.found b{color:var(--ink)}
/* learn */
.stages{display:grid;gap:8px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 160px auto;gap:14px;align-items:center;background:var(--card);border-radius:20px;padding:14px 16px}
.bar{height:6px;border-radius:4px;background:var(--raise2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.stage small{color:var(--muted)}
/* explore */
.search{width:100%;background:var(--card);border:0;border-radius:16px;padding:13px 16px;color:var(--ink);margin:0 0 14px}
.role{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:center;background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:8px}
.role span{color:var(--muted);font-size:13px}
.up{color:var(--ok)}.down{color:var(--muted)}
.note{max-width:1280px;margin:0 auto;padding:0 40px 40px 96px;color:var(--muted);font-size:12.5px}

.kv{display:grid;grid-template-columns:180px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv span{color:var(--muted);font-size:13.5px}
.kv b{font-weight:500}
@media (max-width:700px){.kv{grid-template-columns:1fr auto}.kv span{grid-column:1/-1}}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 14px}
.choice button{all:unset;cursor:pointer;background:var(--card);border-radius:22px;padding:18px}
.choice button b{display:block;font-size:16px;margin-bottom:4px}
.choice button span{color:var(--body);font-size:13.5px}
.choice button[aria-pressed="true"]{outline:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.logo{background:var(--raise);border-radius:18px;padding:14px;display:grid;gap:4px}
.logo b{font-weight:600}
.logo span{color:var(--muted);font-size:12.5px}
.logo .state{font-size:12.5px}
.link{display:flex;justify-content:space-between;align-items:center;gap:14px;background:color-mix(in srgb,var(--accent) 10%,var(--card));border-radius:22px;padding:16px 18px;margin:0 0 14px}
.link p{margin:0;color:var(--body)}
.link b{color:var(--ink)}

</style>
</head>
<body>
<nav class="rail" aria-label="Site"><span>/d</span><span><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg></span><span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.6 2.4 3.9 5.2 3.9 8.5s-1.3 6.1-3.9 8.5c-2.6-2.4-3.9-5.2-3.9-8.5s1.3-6.1 3.9-8.5z"/></svg></span><span><svg viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/></svg></span><span class="on" style="font:700 12px/1 var(--font);color:#fff"><i style="display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(150deg,#7A5AF8,#E8542C);font-style:normal">SY</i></span></nav>
<div class="atlas">
  <aside class="nav" aria-label="Profile">
    <p class="eb">You and your résumé</p>
    <h1>Profile</h1>
    <h3>You</h3>
    <button data-p="about">About you</button>
    <button data-p="resumes">Your résumés <small>2 + 3 profiles</small></button>
    <button data-p="answers">Saved answers <small>14</small></button>
    <h3>Applying</h3>
    <button data-p="auto">Auto-apply <small>Ask me first</small></button>
    <button data-p="conn">Connections <small>1 needs you</small></button>
    <h3>You and draft</h3>
    <button data-p="look">Appearance</button>
    <button data-p="notify">Notifications</button>
    <button data-p="privacy">Privacy and your data</button>
    <button data-p="account">Account</button>
  </aside>
  <main id="main"></main>
</div>
<p class="note">Sketch for D167: Profile as "you", with the same own-navigation pattern as Atlas. Your skills live in Atlas (D169); Profile links there. The owner adds, removes or renames sections.</p>
<script>
(function () {
  var main = document.getElementById("main");
  function kv(rows) { return '<div class="card">' + rows.map(function (r) { return '<div class="kv"><span>' + r[0] + '</span><b>' + r[1] + '</b><button class="quiet">' + (r[2] || "Edit") + '</button></div>'; }).join("") + '</div>'; }
  var P = {
    about: function () { return '<p class="eyebrow">About you</p><h2>Jordan Rivera</h2><p class="lead">What draft uses to fill applications and pick your jobs. Only what you\'ve told us is shown.</p>' +
      '<div class="link"><p><b>Your skills now live in Atlas,</b> next to your map, where you can check and prove them.</p><button class="btn">Open your skills</button></div>' +
      kv([["Email", "jordan@example.com"], ["Phone", "+1 617 555 0142"], ["Location", "Boston, MA · open to remote"], ["Links", "linkedin.com/in/jordan-rivera · github.com/jordan-rivera"], ["Work authorisation", "Authorised now · will need sponsorship later"], ["Experience", "3 years · mid-level"]]); },
    resumes: function () { return '<p class="eyebrow">Your résumés</p><h2>What draft tailors from</h2><p class="lead">A base résumé for each direction, and job profiles that pick which one fits which jobs.</p>' +
      '<div class="card"><h4>Base résumés</h4>' + [["Data engineering", "used by 2 profiles · updated 3 days ago", "Open in the editor"], ["Software engineering", "used by 1 profile · updated last week", "Open in the editor"]].map(function (r) { return '<div class="kv"><span>' + r[1] + '</span><b>' + r[0] + '</b><button class="quiet">' + r[2] + '</button></div>'; }).join("") + '<div class="row" style="margin-top:12px"><button class="btn">Upload a résumé</button></div></div>' +
      '<div class="card"><h4>Job profiles</h4>' + [["Data Engineer · US", "Data engineering résumé · default"], ["Analytics Engineer · remote", "Data engineering résumé"], ["Backend Engineer · Boston", "Software engineering résumé"]].map(function (r) { return '<div class="kv"><span>' + r[1] + '</span><b>' + r[0] + '</b><button class="quiet">Edit</button></div>'; }).join("") + '</div>'; },
    answers: function () { return '<p class="eyebrow">Saved answers</p><h2>Answered once, used every time</h2><p class="lead">The answers you gave during applications. draft reuses them; it never makes up salary, eligibility or legal answers.</p>' +
      kv([["Salary · full-stack, US", "$150,000 · used in 2 applications"], ["Salary · data, US", "$160,000"], ["Notice period", "2 weeks"], ["Relocation", "Open to Boston, New York, remote"], ["Sponsorship", "Not now · later yes"], ["Gender, ethnicity, veteran", "Prefer not to say", "Change"]]); },
    auto: function () { return '<p class="eyebrow">Auto-apply</p><h2>How draft applies for you</h2>' +
      '<div class="choice"><button aria-pressed="true"><b>Ask me first</b><span>draft prepares everything; you press Submit.</span></button><button aria-pressed="false"><b>Apply for me</b><span>draft sends applications that fit your rules.</span></button></div>' +
      kv([["How many", "Up to 10 a day"], ["Which jobs", "Your best bets · 70% match or more"], ["Before sending", "Show me the résumé and answers"], ["Tell me", "Each morning by email"], ["Pausing", "Not paused", "Pause"]]); },
    conn: function () { return '<p class="eyebrow">Connections</p><h2>What draft is connected to</h2><p class="lead">Each one says what draft does with it, and you can remove it any time.</p>' +
      kv([["Gmail", "Not connected · reads only application emails", "Connect"], ["Browser extension", "v1.6 · filling forms on this computer", "Manage"], ["Android app", "Not installed", "Get it"]]) +
      '<div class="card"><h4>Managed portals</h4><p style="margin-bottom:12px">Logins for company application portals, kept encrypted and only used to apply.</p><div class="logos">' +
      [["Workday", "Acme Corp", "connected", "var(--ok)"], ["Workday", "Northwind", "needs attention", "var(--accent)"], ["iCIMS", "Add an account", "", ""], ["Taleo", "Add an account", "", ""]].map(function (l) { return '<div class="logo"><b>' + l[0] + '</b><span>' + l[1] + '</span>' + (l[2] ? '<span class="state" style="--sc:' + l[3] + '">' + l[2] + '</span>' : '<button class="quiet" style="font-size:13px">Add</button>') + '</div>'; }).join("") + '</div></div>'; },
    look: function () { return '<p class="eyebrow">Appearance</p><h2>How draft looks</h2>' +
      '<div class="choice"><button aria-pressed="true"><b>Dusk</b><span>The default: dark, warm and calm.</span></button><button aria-pressed="false"><b>Dusk Light</b><span>The same, on a light background.</span></button><button aria-pressed="false"><b>Studio</b><span>The earlier look.</span></button></div>' +
      kv([["Text size", "Default", "Change"], ["Follow my device", "Light or dark with your system", "Turn on"]]); },
    notify: function () { return '<p class="eyebrow">Notifications</p><h2>When we tell you things</h2>' + kv([["Replies and interview invites", "Right away · email and push"], ["Needs you", "Right away"], ["Daily summary", "8:00 am by email"], ["Today\'s question", "Off", "Turn on"]]); },
    privacy: function () { return '<p class="eyebrow">Privacy and your data</p><h2>What we keep, and for how long</h2><p class="lead">Application emails are kept 6 months. Nothing is used to train models without your separate yes.</p>' +
      kv([["Help improve draft\'s writing", "Off · your résumé, without your name and contact details", "Turn on"], ["Download your data", "Everything, as one file", "Download"], ["Delete your account", "Removes everything, permanently", "Delete"]]); },
    account: function () { return '<p class="eyebrow">Account</p><h2>Signing in and your plan</h2>' + kv([["Sign-in", "Google · jordan@example.com"], ["Plan", "Trial · 9 days left", "See plans"], ["Sign out", "On this device", "Sign out"]]); }
  };
  function show(p) {
    document.querySelectorAll(".nav [data-p]").forEach(function (b) { if (b.getAttribute("data-p") === p) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    main.innerHTML = '<div class="panel">' + P[p]() + "</div>";
    main.querySelectorAll(".choice").forEach(function (g) { g.querySelectorAll("button").forEach(function (b) { b.addEventListener("click", function () { g.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); }); }); });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  document.querySelectorAll(".nav [data-p]").forEach(function (b) { b.addEventListener("click", function () { show(b.getAttribute("data-p")); }); });
  show("about");
})();
</script>
</body>
</html>
